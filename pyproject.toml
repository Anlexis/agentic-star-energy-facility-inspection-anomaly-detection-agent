[project]
name = "ene-c2-011"
version = "0.1.0"
description = "Energy Facility Inspection Report Anomaly Detection Agent -- AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# provided by CI per repo arm -- the CI stub package on PYTHONPATH for the CI stub package-era repos,
# or installed from the package registry for wheel-era repos (see the dual-mode
# run-tests job in the pipeline definition). Pinning it here would make `pip install -e .`
# fail because it is not resolvable from the default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "types-PyYAML==6.0.12.20260815",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# The sample graphs under src/examples/ are distributed reference
# material, not this agent's code — they are type-checked where they are
# maintained, not here.
exclude = ["src/examples/"]
# The published agenticstar-agentcore wheel ships no py.typed marker, so
# framework.* / shared.* imports resolve to Any and every required framework
# subclass would be reported as subclassing Any. All other strict settings stay on.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*"]
ignore_missing_imports = true

# State extends the framework's AgentState TypedDict. That is correct at
# runtime, but the untyped wheel makes AgentState Any, so mypy cannot see the
# TypedDict base and mis-flags the field declarations. Silence only that
# diagnostic, only for the state module.
[[tool.mypy.overrides]]
module = ["src.schemas.state"]
disable_error_code = ["valid-type"]
